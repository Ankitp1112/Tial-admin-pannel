name: Release TIAL customer account extensions

on:
  push:
    branches:
      - cloud/shopify-customer-account-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-customer-account-version:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_SERVICE_ACCOUNT_TOKEN: ${{ secrets.SHOPIFY_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI 5
        run: npm install --global @shopify/cli@^5

      - name: Verify Shopify automation credential exists
        run: |
          if [ -z "$SHOPIFY_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "Missing SHOPIFY_SERVICE_ACCOUNT_TOKEN repository secret."
            exit 1
          fi

      - name: Install TIAL extension dependencies
        run: |
          npm install --prefix shopify/customer-account-extension
          npm install --prefix shopify/customer-account-profile-block

      - name: Validate app and extension configuration
        run: shopify app config validate --config tial-accounts --no-input

      - name: Build all app extensions
        run: shopify app build --config tial-accounts --no-input

      - name: Release TIAL customer account extensions
        run: shopify app deploy --config tial-accounts --no-input
