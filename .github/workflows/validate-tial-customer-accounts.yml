name: Validate TIAL customer account extensions

on:
  push:
    branches:
      - cloud/shopify-customer-account-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Install extension dependencies
        run: |
          npm install --prefix shopify/customer-account-extension
          npm install --prefix shopify/customer-account-profile-block

      - name: Validate app and extension configuration
        run: shopify app config validate --config tial-accounts

      - name: Build app extensions
        run: shopify app build --config tial-accounts
