api_version = "2026-10"

[[extensions]]
type = "ui_extension"
name = "TIAL Account"
handle = "tial-account"
description = "A TIAL-branded customer account dashboard with profile details and recent orders."

[[extensions.targeting]]
target = "customer-account.page.render"
module = "./src/TialAccountPage.jsx"

[[extensions.targeting]]
target = "customer-account.profile.block.render"
module = "./src/TialProfileBlock.jsx"

[extensions.capabilities]
api_access = true
network_access = false
